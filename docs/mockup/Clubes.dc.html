<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clubes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F3F2; color: #1A1112; font-family: 'Barlow', system-ui, sans-serif; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow-y: auto">
    <div style="padding: 28px 20px 12px 20px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; line-height: 1">Clubes</h1>
      <div style="font-size: 14px; color: #625857; margin-top: 6px">17 clubes · ANFA Caupolicán</div>
    </div>

    <div style="padding: 0 20px; position: relative">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0)">Buscar club</label>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#625857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 34px; top: 14px"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14z M21 21l-4.5-4.5"></path></svg>
      <input id="q" type="text" placeholder="Buscar club" style="width: 100%; height: 48px; padding: 0 14px 0 44px; font-size: 16px; color: #1A1112; background: #FFFFFF; border: 1px solid #D2C9C8; border-radius: 12px">
    </div>

    <div style="margin: 14px 20px 24px 20px; background: #FFFFFF; border: 1px solid #E5DEDD; border-radius: 16px; overflow: hidden">
      <sc-for list="{{clubs}}" as="c" hint-placeholder-count="10">
        <a href="Club.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 14px; border-bottom: 1px solid #F1ECEB; background: {{c.rowBg}}">
          <div style="flex: none; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; background: {{c.bg}}; color: {{c.fg}}">{{c.ini}}</div>
          <div style="flex: 1">
            <div style="font-size: 16px; font-weight: 700">{{c.name}}</div>
            <div style="font-size: 13px; color: #625857; margin-top: 2px">{{c.sub}}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#625857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; height: 72px; background: #FFFFFF; border-top: 1px solid #E5DEDD; padding: 0 4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; color: {{t.color}}; font-weight: {{t.weight}}">
        <div style="width: 28px; height: 3px; border-radius: 2px; background: {{t.bar}}"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <div style="font-size: 12px">{{t.label}}</div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = [
      ['AP', 'A. Prat', '#0F766E', '#FFFFFF'],
      ['BO', "Bdo. O'Higgins", '#1E40AF', '#FFFFFF'],
      ['CS', 'Chiguayante Sur', '#0E7490', '#FFFFFF'],
      ['ET', 'El Tigre', '#A16207', '#FFFFFF'],
      ['EV', 'El Valle', '#4D7C0F', '#FFFFFF'],
      ['FB', 'Ferrobadminton', '#374151', '#FFFFFF'],
      ['IN', 'Independiente', '#86198F', '#FFFFFF'],
      ['JA', 'Jackson', '#9A3412', '#FFFFFF'],
      ['LE', 'Leinenweber', '#BE185D', '#FFFFFF'],
      ['ME', 'Maestranza', '#3730A3', '#FFFFFF'],
      ['MG', 'Magallanes', '#166534', '#FFFFFF'],
      ['NA', 'Nacional', '#92400E', '#FFFFFF'],
      ['SP', 'San Pablo', '#0369A1', '#FFFFFF'],
      ['SF', 'Shaub F.C.', '#57534E', '#FFFFFF'],
      ['UB', 'U.L. Bolzhauser', '#7E22CE', '#FFFFFF'],
      ['UC', 'U.L. Carrera', '#1F2937', '#FFFFFF'],
      ['UA', 'Unión Angamos', '#B45309', '#FFFFFF']
    ];
    const T = [
      ['inicio', 'Inicio', 'Inicio.dc.html', 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
      ['fixture', 'Fixture', 'Fixture.dc.html', 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4'],
      ['tabla', 'Tabla', 'Tabla.dc.html', 'M5 20V10 M12 20V4 M19 20v-7'],
      ['noticias', 'Noticias', 'Noticias.dc.html', 'M5 4h12v16H7a2 2 0 0 1-2-2z M17 8h2v10a2 2 0 0 1-2 2 M8 8h6 M8 12h6 M8 16h4'],
      ['clubes', 'Clubes', 'Clubes.dc.html', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z']
    ];
    const active = 'clubes';
    return {
      clubs: C.map(([ini, name, bg, fg]) => {
        const mine = name === "Bdo. O'Higgins";
        return { ini, name, bg, fg, sub: mine ? 'Tu equipo · Plantel y partidos' : 'Plantel y partidos', rowBg: mine ? '#FDF3C4' : '#FFFFFF' };
      }),
      tabs: T.map(([k, label, href, d]) => ({
        label, href, d,
        color: k === active ? '#B3202A' : '#625857',
        bar: k === active ? '#B3202A' : 'transparent',
        weight: k === active ? '700' : '500'
      }))
    };
  }
}
</script>
</body>
</html>
