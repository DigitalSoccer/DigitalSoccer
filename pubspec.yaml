name: anfa_chiguayante
description: "Liga SUR: app de la Asociación de Fútbol Caupolicán (Chiguayante)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Datos de la app: UN solo archivo de datos de muestra (DUMMY, salvo los
  # campos marcados como reales). Se genera con tool/generate_sample_data.dart.
  assets:
    - assets/data/sample_data.json

  # Montserrat (licencia SIL OFL 1.1, ver assets/fonts/montserrat/OFL.txt),
  # empaquetada para funcionar sin internet.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/Montserrat-ExtraBold.ttf
          weight: 800
